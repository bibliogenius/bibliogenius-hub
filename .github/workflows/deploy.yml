name: Hub Deployment

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

env:
  REGISTRY: rg.fr-par.scw.cloud/bibliogenius-hub
  IMAGE_NAME: hub

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Login to Scaleway Registry
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:vps
          platforms: linux/amd64

      # Sync infra files (compose, deploy scripts) to the VPS BEFORE running
      # the deploy script. Without this, edits to docker-compose.vps.yml or
      # vps-deploy.sh in the repo never reach the VPS: the only thing the
      # ssh-action below picks up is the new image tag in the registry.
      - name: Sync infra files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.vps.yml,scripts/vps-deploy.sh"
          target: "/opt/hub/"
          overwrite: true

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: bash /opt/hub/scripts/vps-deploy.sh prod
