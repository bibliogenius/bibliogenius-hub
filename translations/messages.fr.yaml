# Discovery resolver monitoring (ADR-060). The /admin section is the
# only one translated so far; the rest of the dashboard is English.
discovery:
    anchor.hint: "Combien de nos ISBN les sources connaissent. Une valeur basse est ici normale."
    anchor.label: "Taux d'ancrage (24 h)"
    anchor.sub: "%hits% ISBN sur %total% trouvés"
    anchor.sub_baseline: ", moyenne 7 j %baseline% %"
    anchor.sub_collapsed: "0 sur %total% trouvés, moyenne 7 j %baseline% %"
    anchor.sub_idle: "aucune ancre interrogée dans la fenêtre"
    anchor.tip: "Part des ISBN d'ancrage interrogés ces 24 dernières heures que Wikidata ou Inventaire indexent réellement. Seules les recherches à froid sont visibles : une ancre déjà en cache n'appelle aucune source et n'écrit aucune ligne, c'est voulu. C'est un fait sur les SOURCES, pas un défaut de notre côté, et sa valeur normale dépend du catalogue : les ancres de série correspondent bien moins souvent que celles d'auteur, et la BD et le manga français sont les plus pauvres de tous. Ce chiffre ne déclenche donc aucune alerte par sa seule valeur. Lisez-le plutôt face à la moyenne des 7 jours : une chute à zéro alors que la moyenne était positive est la seule chose qu'un seuil absolu ne saurait jamais distinguer d'un catalogue que les sources n'indexent pas, et elle fait passer cette carte à l'orange. Il faut au moins %min% recherches dans la fenêtre, sinon la carte affiche n/a."
    badge_alarm: "alarme"
    badge_coverage: "couverture"
    badge_watch: "à l'œil"
    budget.hint: "Des appels que nous nous refusons, pour rester un invité poli des sources."
    budget.label: "Budget sortant épuisé"
    budget.sub: "%count% sur 7 jours"
    budget.tip: "Nombre de fois où le seau de jetons sortants vers Wikidata et Inventaire, commun à tout le hub, était vide (ADR-060 section 3.4), renvoyant « indisponible » au lieu de résoudre. Quelques occurrences sont normales sous un trafic légitime ; une hausse durable signifie que le budget partagé est trop serré."
    causes_lead: "Pourquoi les issues indisponibles des 24 dernières heures ont renoncé, d'après les événements du hub (canal <code>discovery</code>). Elles n'atteignent jamais le pool, ce sont donc la seule population dont le cache ne peut pas rendre compte."
    causes_more: "<code>outbound_budget_exhausted</code> : le seau global s'est vidé alors que la résolution était déjà lancée, donc les appels déjà payés n'ont rien rapporté. <code>outbound_budget_insufficient</code> : le seau ne pouvait pas couvrir une résolution à froid et elle a été refusée avant son premier appel, ce qui ne coûte rien et laisse les jetons à une résolution capable d'aboutir. <code>resolution_deadline_exceeded</code> : la résolution a consommé son allocation de %deadline% s d'horloge, le hub a donc renoncé avant les 8 s du client plutôt que d'immobiliser un processus pour une réponse que personne ne lirait. Tout le reste est une défaillance côté source (expiration, 5xx, corps illisible), tronquée à ses 100 premiers caractères."
    causes_title: "Causes d'indisponibilité de la découverte (24 h)"
    expiry.hint: "Quand la prochaine réponse en cache expire et devra être redemandée."
    expiry.label: "Prochaine expiration"
    expiry.sub: "expirant sous 7 jours : %count%"
    expiry.sub_empty: "pool vide"
    expiry.tip: "La plus proche échéance encore présente dans le pool. Une ligne résolue vit 30 jours, une ligne ambiguë ou inconnue 7 jours (ADR-060 section 3.3). Balayage nocturne par app:db:prune."
    intro_lead: "Vue en lecture seule du cache mutualisé de complétion séries et auteurs, et de la pression qu'il exerce sur Wikidata et Inventaire."
    intro_more: "Les deux voies sont livrées et partagent ce pool : les lignes <code>series_lookup</code> et <code>author_lookup</code> associent un ISBN d'ancrage à des identifiants d'entité, les lignes <code>series</code> et <code>author</code> portent les charges utiles résolues que tous les lecteurs se partagent. Les chiffres restent petits tant qu'un vrai trafic client ne sollicite pas les points d'entrée."
    last_alert.hint: "La dernière fois que le contrôle nocturne a signalé la carte qualité ci-dessus."
    last_alert.label: "Dernière alerte de dérive"
    last_alert.never: "jamais"
    last_alert.sub: "il y a"
    last_alert.sub_never: "aucune alerte de dérive à ce jour"
    last_alert.tip: "Date de la dernière alerte de dérive émise par app:db:prune (événements du hub, canal maintenance, message discovery_drift_degraded). « never » signifie qu'elle ne s'est jamais déclenchée."
    no_unavailable: "Aucune issue indisponible dans la fenêtre."
    pool.hint: "Des réponses que les lecteurs se partagent. Plus il est gros, moins on sollicite les sources."
    pool.label: "Pool de cache"
    pool.sub: "lignes en pool, %mb% Mo de charge utile"
    pool.sub_empty: "fonction jamais sollicitée"
    pool.tip: "Nombre total de lignes dans discovery_cache, tous types et statuts, avec le poids des charges utiles en dessous. Zéro signifie que la fonction n'a jamais servi. Le poids est celui des données non compressées, celui que budgète l'élagage nocturne ; sur disque, Postgres compresse d'environ 2,6 fois. L'élagage plafonne les charges utiles à 128 Mo (les échéances les plus lointaines sont gardées en premier) et journalise discovery_cache_over_budget dans les événements du hub quand il doit couper."
    pool_empty: "Pool vide, rien à détailler pour l'instant."
    pool_table_lead: "<strong>Détail du pool.</strong> Une ligne <code>*_lookup</code> associe un ISBN d'ancrage à un identifiant d'entité ; une ligne <code>series</code> ou <code>author</code> porte la charge utile que les lecteurs voient vraiment."
    pool_table_more: "Un statut se lit selon la ligne qui le porte : <code>unknown</code> sur une ligne <code>*_lookup</code> signifie que les sources n'ont jamais indexé cet ISBN, ce qui est ordinaire, alors que <code>unknown</code> sur une ligne <code>series</code> ou <code>author</code> signifie qu'une entité a été trouvée mais est revenue vide, et c'est la forme que prend une dérive des sources."
    quality.hint: "Des entités trouvées, puis revenues vides. Proche de 0 % est sain ; c'est ici l'alarme."
    quality.label: "Qualité de résolution (%days% j)"
    quality.sub_alert: "%failed% sur %total% revenues vides, seuil %threshold% %"
    quality.sub_low: "récupérations d'entité : %count% en %days% j, trop peu pour juger"
    quality.sub_ok: "%failed% sur %total% revenues vides, sous le seuil de %threshold% %"
    quality.sub_trimmed: "événements du hub rognés au-delà de la fenêtre de %days% j, jugement impossible"
    quality.tip: "Parmi les entités identifiées chez la source et réellement récupérées ces %days% derniers jours, la part revenue vide au lieu d'une charge utile exploitable : une série sans liste de volumes, un auteur sans bibliographie. C'est l'alarme de dérive des sources : une chaîne saine reste ici proche de 0 %, et un changement silencieux de schéma SPARQL ou d'API la fait monter en moins d'une journée. À partir de %threshold% %, l'élagage nocturne app:db:prune écrit discovery_drift_degraded dans les événements du hub (canal maintenance), au plus une fois par 24 h. Les deux moitiés du ratio sont comptées aux mêmes occasions, et c'est ce qui rend le pourcentage honnête : une entité servie depuis le pool n'est jamais récupérée et n'est jamais comptée, ni d'un côté ni de l'autre. Tout ce qui se décide avant l'étape entité est exclu et présenté en comptes bruts plus bas, tout ce qui est perdu à cause d'une panne est sur la carte Part d'indisponibilité. C'est la seule carte qui ne lit pas les dernières 24 h : une entité n'est récupérée à froid que quelques fois par jour et il faut %min% échantillons pour qu'un pourcentage veuille dire quelque chose, elle regarde donc %days% jours en arrière. L'alerte qu'elle déclenche reste limitée à une par 24 h. Un cas affiche n/a en orange : les événements du hub sont plafonnés en nombre de lignes autant qu'en jours, donc dès que le hub écrit plus d'événements par semaine que ce plafond, l'élagage nocturne mange le bout le plus ancien de cette fenêtre. Les échecs seraient alors sous-comptés et pas les succès, et le pourcentage semblerait rassurant. La carte refuse de le calculer plutôt que de vous montrer ça. Relever le plafond, ou en exempter le canal discovery comme maintenance l'est déjà, rétablit la mesure."
    ratios_lead: "<strong>Comment lire les deux ratios ci-dessous.</strong> Ils répondent à des questions différentes et un seul déclenche une alarme."
    ratios_more: "Le <em>taux d'ancrage</em> parle des SOURCES : combien de nos ISBN Wikidata et Inventaire indexent. Il est bas par nature sur un catalogue français, il n'alerte donc jamais sur sa seule valeur. La <em>qualité de résolution</em> parle des RÉPONSES : parmi les entités que nous avons identifiées et récupérées, combien sont revenues vides. C'est ce que produit un changement silencieux de schéma, et c'est ce ratio que le contrôle nocturne surveille. Les échecs décidés plus tôt, entre les deux, sont listés plus bas mais ne portent aucun pourcentage : ils peuvent se répéter sur des recherches en cache, donc en faire un taux ferait grossir le chiffre avec le trafic plutôt qu'avec la panne. Cette carte qualité est aussi la seule ici à regarder %days% jours en arrière plutôt qu'un seul : les entités ne sont récupérées à froid que quelques fois par jour, et un pourcentage a besoin d'échantillons pour vouloir dire quelque chose."
    read_more: "Lire la suite"
    reason.disjoint_anchors: "Les ISBN d'ancrage pointaient vers des séries sans rapport."
    reason.name_not_verified: "L'ancre a donné un auteur dont le libellé n'est pas le nom demandé : la réponse aurait été la bibliographie d'un homonyme."
    reason.no_anchor_resolved: "Aucun des ISBN d'ancrage n'est indexé par les sources."
    reason.no_clear_winner: "Plusieurs séries candidates ont subsisté et le nom n'a pas tranché."
    reason.no_usable_members: "La série a été trouvée mais sa liste de volumes est revenue vide."
    reason.no_usable_works: "L'auteur a été trouvé mais la bibliographie est revenue vide."
    reasons_lead: "Toutes les issues non résolues des deux voies, lues dans les événements du hub (canal <code>discovery</code>). La colonne <strong>Compte comme</strong> dit ce que vaut chaque raison."
    reasons_more: "<em>couverture</em> : ce que les sources indexent, rapporté par la carte du taux d'ancrage, n'alerte jamais. <em>alarme</em> : surveillé par la carte de qualité de résolution, les deux façons dont une entité récupérée peut revenir vide. <em>à l'œil</em> : de vrais problèmes de qualité, mais ils peuvent se rejouer indéfiniment à partir de recherches en cache, donc tout pourcentage bâti dessus monterait avec le trafic plutôt qu'avec la panne. Lisez-les en comptes, et comparez-les à ceux de la veille. L'épuisement du budget sortant relève de la pression sur les sources et possède sa carte plus haut. Attention aux fenêtres : les comptes de ce tableau couvrent 24 h, alors que la carte d'alarme regarde %days% jours en arrière, donc une raison peut afficher zéro ici pendant que cette carte est encore au rouge."
    reasons_title: "Raisons d'échec de la découverte (24 h)"
    section_title: "Résolveur de découverte (ADR-060)"
    th_cause: "Cause"
    th_count_24h: "Compte (24 h)"
    th_counts_as: "Compte comme"
    th_kind: "Type"
    th_reason: "Raison"
    th_rows: "Lignes"
    th_status: "Statut"
    th_what: "Ce qui s'est passé"
    unavailable.hint: "Perdues à cause d'une panne ou de notre propre budget, pas à cause des données."
    unavailable.label: "Part d'indisponibilité (24 h)"
    unavailable.sub: "%count% issues sur %total%"
    unavailable.sub_low: "pas encore assez d'issues"
    unavailable.tip: "Part des issues des 24 dernières heures terminées en « indisponible » : la source a échoué, a expiré, ou le budget d'appels sortants a refusé l'appel. Ces issues n'écrivent jamais de ligne de cache, donc aucun ratio calculé sur le pool ne peut les voir, d'où leur carte dédiée. Le dénominateur additionne les lignes entité résolues et chaque issue journalisée, soit une trace par issue et jamais deux. Ce sont des issues parvenues à une décision, pas des requêtes HTTP : une requête entièrement servie par le cache ne touche aucune source et reste invisible, c'est voulu, tandis qu'une réponse négative servie par le cache est journalisée et compte, sans aucun coût sortant. Il faut au moins %min% issues dans la fenêtre, sinon la carte affiche n/a."
    writes.hint: "Du volume brut, pas des résolutions. Un petit nombre rend chaque % fragile."
    writes.label: "Écritures en cache (24 h)"
    writes.sub: "écritures en cache, toutes issues"
    writes.tip: "Lignes écrites dans le pool ces 24 dernières heures, toutes issues confondues (résolue, ambiguë, inconnue). Ce n'est PAS un compte de résolutions : une résolution écrit jusqu'à quatre lignes, une par ISBN d'ancrage interrogé plus sa charge utile. C'est le volume brut sur lequel reposent les pourcentages de cette ligne : en dessous d'une douzaine, tous les ratios de cette page sont fragiles."

# Relationship counters on the /admin dashboard. Plain prose on purpose: no
# markup in these values, so the template renders them without |raw.
follows:
    active.label: "Abonnements actifs"
    active.sub: "sur %total% lignes d'abonnement"
    active.tip: "Arêtes d'abonnement acceptées, une ligne par sens. Deux lignes entre les deux mêmes bibliothèques forment une seule paire mutuelle."
    pairs.label: "Paires mutuelles"
    pairs.sub: "%libraries% bibliothèques dans un abonnement actif"
    pairs.sub_empty: "aucune relation mutuelle pour l'instant"
    pairs.tip: "Paires de bibliothèques qui s'abonnent l'une à l'autre, les deux sens actifs. Comptées une seule fois par paire, et un nœud qui s'abonne à lui-même est exclu. C'est le seul chiffre ici qui signifie que deux bibliothèques sont réellement reliées."
    pending.label: "Abonnements en attente"
    pending.sub: "%rejected% refusés, %blocked% bloqués"
    pending.tip: "Demandes d'abonnement en attente d'acceptation ou de refus par la bibliothèque suivie. Un nombre qui ne fait que croître suggère que les demandes ne remontent pas dans l'application."
    section_lead: "Forme du réseau. Un abonnement est orienté, donc le total compte des gestes et non des liens : de nombreuses bibliothèques suivant une même bibliothèque vitrine produisent un total élevé et aucune paire mutuelle. La réciprocité est le chiffre sur lequel reposent l'échange, les groupes et les suggestions entre pairs. Les appairages P2P directs restent sur l'appareil par conception (ADR-044) et n'atteignent jamais le hub : ces compteurs sont donc un plancher du graphe réel, pas son recensement."
