# Discovery resolver monitoring (ADR-060). The /admin section is the
# only one translated so far; the rest of the dashboard is English.
discovery:
    anchor.hint: "How many of our ISBNs the sources know. A low value is normal here."
    anchor.label: "Anchor Hit Rate (24h)"
    anchor.sub: "%hits% of %total% ISBNs matched"
    anchor.sub_baseline: ", 7d baseline %baseline%%"
    anchor.sub_collapsed: "0 of %total% matched, 7d baseline %baseline%%"
    anchor.sub_idle: "no anchor looked up in the window"
    anchor.tip: "Share of the anchor ISBNs looked up in the last 24h that Wikidata or Inventaire actually index. Only cold lookups are visible: an anchor already cached makes no source call and writes no row, on purpose. This is a fact about the SOURCES, not a defect of ours, and its normal value depends on the catalogue: series anchors match far less often than author ones, and French comics and manga are the thinnest of all. So it raises no alarm on its own value. Read it against the 7-day baseline instead: a fall to zero while the baseline was positive is the one thing an absolute threshold could never separate from a catalogue the sources simply do not index, and it turns this card orange. Needs at least %min% lookups in the window, else it reads n/a."
    badge_alarm: "alarm"
    badge_coverage: "coverage"
    badge_watch: "watch by eye"
    budget.hint: "Calls we refused ourselves, to stay a polite guest of the sources."
    budget.label: "Outbound Budget Exhausted"
    budget.sub: "%count% over 7 days"
    budget.tip: "Times the hub-wide outbound token bucket to Wikidata/Inventaire was empty (ADR-060 section 3.4), returning 'unavailable' instead of resolving. Occasional hits are expected under legitimate traffic; a sustained rise means the shared budget is too tight."
    causes_lead: "Why the unavailable outcomes of the last 24h gave up, read from Hub Events (channel <code>discovery</code>). These never reach the pool, so they are the one population the cache cannot account for."
    causes_more: "<code>outbound_budget_exhausted</code>: the global bucket emptied while the resolution was already running, so the calls it had already paid for bought nothing. <code>outbound_budget_insufficient</code>: the bucket could not cover a cold resolution and it was refused before its first call, which costs nothing and leaves the tokens to a resolution that can finish. <code>resolution_deadline_exceeded</code>: the resolution spent its %deadline%s wall-clock allowance, so the hub gave up before the client's 8s rather than hold a worker for an answer nobody would read. Anything else is a source-side failure (timeout, 5xx, undecodable body), truncated to its first 100 characters."
    causes_title: "Discovery Unavailable Causes (24h)"
    expiry.hint: "When the next cached answer expires and must be asked again."
    expiry.label: "Next Expiry"
    expiry.sub: "expiring in under 7 days: %count%"
    expiry.sub_empty: "pool empty"
    expiry.tip: "Soonest expires_at still in the pool. Resolved rows live 30 days, ambiguous/unknown rows 7 days (ADR-060 section 3.3). Swept nightly by app:db:prune."
    intro_lead: "Read-only view of the pooled series/author completion cache and the pressure it puts on Wikidata/Inventaire."
    intro_more: "Both lanes are shipped and share this pool: <code>series_lookup</code> and <code>author_lookup</code> rows map one anchor ISBN to entity ids, <code>series</code> and <code>author</code> rows hold the resolved payloads every reader shares. Figures stay small until real client traffic exercises the endpoints."
    last_alert.hint: "The last time the nightly check flagged the quality card above."
    last_alert.label: "Last Drift Alert"
    last_alert.never: "never"
    last_alert.sub: "ago"
    last_alert.sub_never: "no source-drift alert yet"
    last_alert.tip: "When app:db:prune last emitted the source-drift warning (Hub Events, channel maintenance, message discovery_drift_degraded). Never means it has not fired yet."
    no_unavailable: "No unavailable outcome in the window."
    pool.hint: "Answers readers share. The bigger it is, the less we ask the sources."
    pool.label: "Cache Pool"
    pool.sub: "pooled rows, %mb% MB of payload"
    pool.sub_empty: "feature never exercised"
    pool.tip: "Total rows in discovery_cache, all kinds and statuses, with the payload weight underneath. Zero means the feature has never been exercised yet. The weight is uncompressed payload, what the nightly prune budgets; on disk Postgres compresses it by roughly 2.6x. The prune caps the payloads at 128 MB (freshest expiry kept first) and logs discovery_cache_over_budget in Hub Events when it has to cut."
    pool_empty: "Pool empty, nothing to break down yet."
    pool_table_lead: "<strong>Pool breakdown.</strong> A <code>*_lookup</code> row maps one anchor ISBN to an entity id; a <code>series</code> or <code>author</code> row holds the payload readers actually see."
    pool_table_more: "Read a status by the row it sits on: <code>unknown</code> on a <code>*_lookup</code> row means the sources never indexed that ISBN, which is ordinary, while <code>unknown</code> on a <code>series</code> or <code>author</code> row means an entity was found but came back empty, which is the shape source drift takes."
    quality.hint: "Entities found, then returned empty. Near 0% is healthy; this is the alarm."
    quality.label: "Resolution Quality (%days%d)"
    quality.sub_alert: "%failed% of %total% came back empty, threshold %threshold%%"
    quality.sub_low: "entity fetches: %count% in %days%d, too few to judge"
    quality.sub_ok: "%failed% of %total% came back empty, below the %threshold%% threshold"
    quality.sub_trimmed: "Hub Events trimmed past the %days%d window, cannot judge"
    quality.tip: "Of the entities identified at the source and actually fetched in the last %days% days, the share that came back empty instead of with a usable payload: a series with no volume list, an author with no bibliography. This is the source-drift alarm: a healthy pipeline sits near 0% here, and a silent SPARQL or API change pushes it up within a day. At or above %threshold%%, the nightly app:db:prune writes discovery_drift_degraded in Hub Events (channel maintenance), once per 24h at most. Both halves are counted on the same occasions, which is what makes the percentage honest: an entity served from the pool is never fetched and never counted, on either side. Everything decided before the entity stage is excluded and shown as raw counts below, everything lost to an outage is on the Unavailable Share card. This is the one card that does not read the last 24h: an entity is fetched cold only a few times a day and %min% samples are needed before a percentage means anything, so it looks back %days% days. The alert it raises is still deduplicated to once per 24h. One case reads n/a in orange: Hub Events is capped in rows as well as in days, so once the hub writes more events per week than that cap, the nightly prune eats the far end of this window. Failures would then be under-counted while successes are not, and the percentage would read reassuringly low. The card refuses to compute it rather than show you that. Raising the cap, or exempting the discovery channel from it as maintenance already is, restores the measure."
    ratios_lead: "<strong>Reading the two ratios below.</strong> They answer different questions and only one of them raises an alarm."
    ratios_more: "<em>Anchor Hit Rate</em> is about the SOURCES: how many of our ISBNs Wikidata and Inventaire happen to index. It is low by nature on a French catalogue, so it never alerts on its own value. <em>Resolution Quality</em> is about the ANSWERS: of the entities we did identify and fetch, how many came back empty. That is what a silent schema change makes happen, and it is the one the nightly check alerts on. Failures decided earlier, between the two, are listed further down but carry no percentage: they can repeat on cached lookups, so counting them as a rate would make the figure grow with traffic rather than with breakage. That quality card is also the only one here that looks back %days% days instead of one: entities are fetched cold only a few times a day, and a percentage needs samples before it means anything."
    read_more: "Read more"
    reason.disjoint_anchors: "The anchor ISBNs pointed at unrelated series."
    reason.name_not_verified: "The anchor gave an author whose label is not the name asked about, so the answer would have been a homonym's bibliography."
    reason.no_anchor_resolved: "None of the anchor ISBNs is indexed by the sources."
    reason.no_clear_winner: "Several candidate series survived and the name did not settle it."
    reason.no_usable_members: "The series was found but its volume list came back empty."
    reason.no_usable_works: "The author was found but the bibliography came back empty."
    reasons_lead: "Every non-resolved outcome of both lanes, read from Hub Events (channel <code>discovery</code>). The <strong>Counts as</strong> column says what each reason is worth."
    reasons_more: "<em>coverage</em>: about what the sources index, reported by the Anchor Hit Rate card, never alerts. <em>alarm</em>: watched by the Resolution Quality card, the two ways a fetched entity can come back empty. <em>watch by eye</em>: real quality problems, but they can be decided again and again from cached lookups, so any percentage built on them would rise with traffic rather than with breakage. Read those as counts, and compare them with yesterday's. Outbound budget exhaustion is source pressure and has its own card above. Mind the windows: the counts in this table cover 24h, while the alarm card looks back %days% days, so a reason can read zero here while that card is still red."
    reasons_title: "Discovery Failure Reasons (24h)"
    section_title: "Discovery Resolver (ADR-060)"
    th_cause: "Cause"
    th_count_24h: "Count (24h)"
    th_counts_as: "Counts as"
    th_kind: "Kind"
    th_reason: "Reason"
    th_rows: "Rows"
    th_status: "Status"
    th_what: "What happened"
    unavailable.hint: "Lost to an outage or to our own budget, not to the data."
    unavailable.label: "Unavailable Share (24h)"
    unavailable.sub: "%count% of %total% outcomes"
    unavailable.sub_low: "not enough outcomes yet"
    unavailable.tip: "Share of the 24h outcomes that ended unavailable: the source failed, timed out, or the outbound budget refused the call. These never write a cache row, so no ratio computed over the pool can see them, which is why they get their own card. Denominator is resolved entity rows plus every journalled discovery outcome, one trace per outcome and never two. It counts outcomes that reached a decision, not HTTP requests: a fully warm request touches no source and is invisible on purpose, a warm negative one is journalled and counts at zero outbound cost. Needs at least %min% outcomes in the window, else it reads n/a."
    writes.hint: "Raw volume, not resolutions. Small numbers make every % fragile."
    writes.label: "Cache Writes (24h)"
    writes.sub: "cache writes, all outcomes"
    writes.tip: "Rows written to the pool in the last 24h, every outcome (resolved, ambiguous, unknown). This is NOT a resolution count: one resolution writes up to four rows, one per anchor ISBN it looked up plus its payload. It is here as the raw volume the percentages on this row rest on: below a dozen, every ratio on this page is fragile."
