parameters:
    sidecar_default: null
    covers_directory: '%kernel.project_dir%/var/data/covers'
    # ADR-031: mailbox ownership enforcement. Shadow-by-default (false) so the
    # ownership check logs hijack attempts without blocking. Flip to "1" via the
    # MAILBOX_OWNERSHIP_ENFORCED env var after the 72h shadow window.
    mailbox_ownership_enforced_default: '0'
    # Catalog-coverage alert threshold: alive libraries with books but no
    # valid cached catalog. Baseline is ~31 while the fleet picks up the
    # keep-alive fix and should shrink toward 0; the default only fires on
    # a regression above that baseline. Override via the
    # CATALOG_COVERAGE_ALERT_THRESHOLD env var (lower it as the fleet heals).
    catalog_coverage_alert_threshold_default: '40'
    # Discovery source-drift alert threshold (ADR-060): percent of
    # non-resolved outcomes among the last 24h of discovery_cache writes.
    # SPARQL schemas and API shapes change silently; past this share the
    # nightly prune emits a hub_events warning so the regression shows up
    # in /admin within a day. Override via DISCOVERY_DRIFT_ALERT_THRESHOLD.
    discovery_drift_alert_threshold_default: '50'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # WebSocket sidecar notifier (ADR-017)
    # SIDECAR_URL env var is optional: defaults to http://127.0.0.1:9090 if unset
    App\Service\SidecarNotifier:
        arguments:
            $sidecarUrl: '%env(default:sidecar_default:SIDECAR_URL)%'

    # Directory service (ADR-031: mailbox ownership feature flag)
    App\Service\DirectoryService:
        arguments:
            $mailboxOwnershipEnforced: '%env(bool:default:mailbox_ownership_enforced_default:MAILBOX_OWNERSHIP_ENFORCED)%'

    # Jira integration service
    App\Service\JiraService:
        arguments:
            $jiraBaseUrl: '%env(JIRA_BASE_URL)%'
            $jiraProjectKey: '%env(JIRA_PROJECT_KEY)%'
            $jiraEmail: '%env(JIRA_EMAIL)%'
            $jiraApiToken: '%env(JIRA_API_TOKEN)%'

    # Account E2EE sync (ADR-043): opaque session bearer tokens live in a
    # dedicated cache pool (only their SHA-256 hashes are stored).
    App\Service\AccountAuthService:
        arguments:
            $sessionCache: '@account.session.cache'
