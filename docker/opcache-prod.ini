; Production OPcache tuning for the hub image.
;
; Safe because the prod image is IMMUTABLE: vendor/ and application code are
; baked at build time (composer install in Dockerfile) and never change at
; runtime. validate_timestamps=0 therefore drops a stat() per file per request
; with zero correctness risk -- the cache is rebuilt only when a new image is
; built and deployed.
;
; This file is copied ONLY by Dockerfile (prod). Dockerfile.dev intentionally
; omits it: the dev container bind-mounts the source tree, so it needs
; timestamp validation (the default) to pick up live edits.
;
; No JIT: opcache.jit gives marginal-to-negative returns on typical I/O-bound
; Symfony web workloads and adds risk, so it is deliberately left off.
; No preload here either: opcache.preload is a separate, higher-risk change
; (needs a Symfony preload script) and is tracked as a follow-up.

opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.max_wasted_percentage=10
