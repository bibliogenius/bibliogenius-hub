; Production PHP hardening for the hub image.
;
; This file is copied ONLY by Dockerfile (prod), like opcache-prod.ini.
;
; session.upload_progress: the hub never uses PHP's upload progress tracking.
; Left on (the PHP default), any multipart request carrying a
; PHP_SESSION_UPLOAD_PROGRESS field makes PHP write a session file with
; attacker-chosen content, whether or not the app uses sessions.

session.upload_progress.enabled=0
