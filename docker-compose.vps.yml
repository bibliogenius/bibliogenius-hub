# Docker Compose for Scaleway VPS deployment
# Both prod and staging run on the same VPS behind a host-level Caddy reverse proxy.
# TLS is handled by the host Caddy (Caddyfile.vps), NOT by these containers.
#
# Secrets are injected via scripts/vps-deploy.sh which fetches them from
# Scaleway Secret Manager and generates a temporary .env.{ENV} file.
# The .env.{ENV}.config files contain non-secret configuration only.

services:
  hub-prod:
    image: rg.fr-par.scw.cloud/bibliogenius-hub/hub:vps
    container_name: hub-prod
    restart: unless-stopped
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.prod.config
      - .env.prod
    volumes:
      - hub_prod_var:/app/var
      # ADR-035: city dataset shared across environments. Host bind so
      # files survive image rebuilds and a yearly cron on the VPS host
      # can refresh them with `docker exec hub-prod app:build-cities --force`.
      # `mkdir -p /var/lib/bibliogenius/cities` once on the host before
      # the first compose up.
      - /var/lib/bibliogenius/cities:/app/public/static/cities
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  hub-staging:
    image: rg.fr-par.scw.cloud/bibliogenius-hub/hub:vps
    container_name: hub-staging
    restart: unless-stopped
    ports:
      - "8081:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.staging.config
      - .env.staging
    volumes:
      - hub_staging_var:/app/var
      # Same shared city dataset as prod (public, identical data).
      - /var/lib/bibliogenius/cities:/app/public/static/cities
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ws-sidecar-prod:
    image: rg.fr-par.scw.cloud/bibliogenius-hub/ws-sidecar:vps
    container_name: ws-sidecar-prod
    restart: unless-stopped
    ports:
      - "9091:9091"
    # Internal port NOT exposed to host: only reachable via Docker network.
    environment:
      - RUST_LOG=info
      - PUBLIC_PORT=9091
      - INTERNAL_PORT=9090
      - INTERNAL_BIND=0.0.0.0
      - HUB_INTERNAL_URL=http://hub-prod:80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  ws-sidecar-staging:
    image: rg.fr-par.scw.cloud/bibliogenius-hub/ws-sidecar:vps
    container_name: ws-sidecar-staging
    restart: unless-stopped
    ports:
      - "9092:9091"
    # Internal port NOT exposed to host: only reachable via Docker network.
    environment:
      - RUST_LOG=info
      - PUBLIC_PORT=9091
      - INTERNAL_PORT=9090
      - INTERNAL_BIND=0.0.0.0
      - HUB_INTERNAL_URL=http://hub-staging:80
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  hub_prod_var:
  hub_staging_var:
